<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walmart Sync Configuration</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #0071dc;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 12px;
    }
    #status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h3>Walmart Receipt Sync</h3>
  <label for="envFileInput">Upload .env File:</label>
  <input type="file" id="envFileInput" accept=".env, .txt" />
  <button id="clearBtn" type="button" style="margin-top: 12px; background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
    Reset / Clear .env
  </button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
